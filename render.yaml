services:
  - type: web
    name: battle-tetris
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: VITE_SOCKET_URL
        value: ""
      - key: CLIENT_URL
        value: "https://battle-tetris.onrender.com"
